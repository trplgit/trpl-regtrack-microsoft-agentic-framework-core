name: Deploy RegInsights Worker

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (staging or production)"
        required: true
        type: string

jobs:

  # ============================================================
  # BUILD AND PUSH
  # ============================================================
  build-and-push:
    name: Build and Push RegInsights Image
    runs-on: ubuntu-latest

    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
      ENVIRONMENT: ${{ inputs.environment }}

    outputs:
      IMAGE: ${{ steps.set-image.outputs.image }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # --------------------------------------------------------
      # Install Azure CLI
      # --------------------------------------------------------
      - name: Install Azure CLI
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            curl \
            apt-transport-https \
            lsb-release \
            gnupg

          sudo mkdir -p /etc/apt/keyrings

          curl -sL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null

          AZ_DIST=$(lsb_release -cs)

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $AZ_DIST main" \
            | sudo tee /etc/apt/sources.list.d/azure-cli.list

          sudo apt-get update
          sudo apt-get install -y azure-cli

      # --------------------------------------------------------
      # Download secure files
      # --------------------------------------------------------
      - name: Download secure files from Azure Blob
        run: |
          set -e

          mkdir -p libs

          echo "Downloading Trplclientsecret.dll..."

          az storage blob download \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name trpl-regtrack-microsoft-agentic-framework-core \
            --name "${ENVIRONMENT}/Trplclientsecret.dll" \
            --file libs/Trplclientsecret.dll \
            --overwrite

          echo "Downloading appsettings.json..."

          az storage blob download \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --account-key "$AZURE_STORAGE_KEY" \
            --container-name trpl-regtrack-microsoft-agentic-framework-core \
            --name "${ENVIRONMENT}/appsettings.json" \
            --file appsettings.json \
            --overwrite

          echo "Secure files downloaded successfully."

      # --------------------------------------------------------
      # Login to ACR
      # --------------------------------------------------------
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # --------------------------------------------------------
      # Build and Push Worker Image
      # --------------------------------------------------------
      - name: Build and Push Docker Image
        id: set-image
        run: |
          set -e

          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/${{ inputs.environment }}/trpl-regtrack-insights-worker:latest

          echo "=========================================="
          echo "Building RegInsights Image"
          echo "Image: $IMAGE"
          echo "=========================================="

          docker build --no-cache \
            -f Dockerfile \
            -t "$IMAGE" \
            .

          echo "Pushing image..."

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Image pushed successfully"
          echo "=========================================="

  # ============================================================
  # DEPLOY TO AKS
  # ============================================================
  deploy-to-aks:
    name: Deploy RegInsights to AKS
    runs-on: ubuntu-latest

    needs: build-and-push

    environment: ${{ inputs.environment }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------------
      # Get AKS credentials
      # --------------------------------------------------------
      - name: Set AKS context
        run: |
          az aks get-credentials \
            --resource-group TRPL-DEMOGROUP \
            --name TRPL-Demo-Cluster \
            --overwrite-existing

      # --------------------------------------------------------
      # Create namespace
      # --------------------------------------------------------
      - name: Create namespace
        run: |
          kubectl create namespace ${{ inputs.environment }} \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # --------------------------------------------------------
      # Create ACR pull secret
      # --------------------------------------------------------
      - name: Create image pull secret
        run: |
          kubectl create secret docker-registry acr-pull-secret \
            --docker-server=${{ vars.ACR_NAME }}.azurecr.io \
            --docker-username=${{ vars.ACR_USERNAME }} \
            --docker-password=${{ secrets.ACR_PASSWORD }} \
            -n ${{ inputs.environment }} \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ========================================================
      # DEPLOYMENT
      # ========================================================

      # --------------------------------------------------------
      # Validate Deployment YAML
      # --------------------------------------------------------
      - name: Validate Deployment YAML
        run: |
          kubectl apply \
            --dry-run=client \
            -f k8s/deployment.staging.yaml \
            -n ${{ inputs.environment }}

      # --------------------------------------------------------
      # Apply Deployment
      # --------------------------------------------------------
      - name: Apply Deployment
        run: |
          kubectl apply \
            -f k8s/deployment.staging.yaml \
            -n ${{ inputs.environment }}

      # --------------------------------------------------------
      # Update Image
      # --------------------------------------------------------
      - name: Update Deployment Image
        run: |
          kubectl set image \
            deployment/trpl-regtrack-insights-worker \
            trpl-regtrack-insights-worker=${{ needs.build-and-push.outputs.IMAGE }} \
            -n ${{ inputs.environment }}

      # --------------------------------------------------------
      # Apply Service
      # --------------------------------------------------------
      - name: Apply Service
        run: |
          kubectl apply \
            -f k8s/service.staging.yaml \
            -n ${{ inputs.environment }}

      # --------------------------------------------------------
      # Apply Ingress
      # --------------------------------------------------------
      - name: Apply Ingress
        run: |
          kubectl apply \
            -f k8s/ingress.staging.yaml \
            -n ${{ inputs.environment }}

      # --------------------------------------------------------
      # Restart Deployment
      # --------------------------------------------------------
      - name: Restart Deployment
        run: |
          kubectl rollout restart \
            deployment/trpl-regtrack-insights-worker \
            -n ${{ inputs.environment }}

      # --------------------------------------------------------
      # Wait for Rollout
      # --------------------------------------------------------
      # [ADDED 2026-09-18] Found live: run #25 of this workflow (commit c6b611a)
      # failed here at exactly 10m0s - "deployment exceeded its progress deadline",
      # only 2 of 4 replicas updated. Cause: that same commit added
      # terminationGracePeriodSeconds: 130 (+ a 10s preStop sleep) to
      # k8s/deployment.staging.yaml, deliberately, so a draining pod gets a real
      # chance to finish an in-flight activity instead of being SIGKILLed - see
      # that file's own comment. Under the default rolling-update strategy (no
      # maxUnavailable/maxSurge override), that makes each pod replacement take
      # meaningfully longer than before, and 4 replicas no longer fit in 10
      # minutes. Raised, not the grace period - 130s is tied to a real measured
      # constant (SqlOrchestrationServiceSettings.WorkItemLockTimeout's actual
      # default, 2 minutes), shrinking it would undo the fix it exists for.
      - name: Wait for Rollout
        run: |
          kubectl rollout status \
            deployment/trpl-regtrack-insights-worker \
            -n ${{ inputs.environment }} \
            --timeout=20m

      # ========================================================
      # VERIFICATION
      # ========================================================

      - name: Verify Deployment
        run: |

          echo "=========================================="
          echo "PODS"
          echo "=========================================="

          kubectl get pods \
            -n ${{ inputs.environment }} \
            -o wide

          echo "=========================================="
          echo "SERVICES"
          echo "=========================================="

          kubectl get svc \
            -n ${{ inputs.environment }}

          echo "=========================================="
          echo "ENDPOINTS"
          echo "=========================================="

          kubectl get endpoints \
            trpl-regtrack-insights-worker \
            -n ${{ inputs.environment }}

          echo "=========================================="
          echo "INGRESS"
          echo "=========================================="

          kubectl get ingress \
            -n ${{ inputs.environment }}

          echo "=========================================="
          echo "DEPLOYMENT"
          echo "=========================================="

          kubectl get deployment \
            trpl-regtrack-insights-worker \
            -n ${{ inputs.environment }}

          echo "=========================================="
          echo "ROLLOUT STATUS"
          echo "=========================================="

          kubectl rollout status \
            deployment/trpl-regtrack-insights-worker \
            -n ${{ inputs.environment }} \
            --timeout=2m
