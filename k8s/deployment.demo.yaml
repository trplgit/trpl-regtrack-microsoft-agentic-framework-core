apiVersion: apps/v1
kind: Deployment

metadata:
  name: trpl-regtrack-insights-worker-demo
  namespace: demo
  labels:
    app: trpl-regtrack-insights-worker-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: trpl-regtrack-insights-worker-demo

  template:
    metadata:
      labels:
        app: trpl-regtrack-insights-worker-demo

    spec:
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: acr-pull-secret

      containers:
        - name: trpl-regtrack-insights-worker-demo

          image: conatinerimages.azurecr.io/demo/trpl-regtrack-insights-worker:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: DOTNET_ENVIRONMENT
              value: "demo"

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            - name: Agents__MaxConcurrentLlmCalls
              value: "1"

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "1"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

      terminationGracePeriodSeconds: 130
