apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: trpl-regtrack-insights-api
  namespace: staging

  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "75m"

spec:
  rules:
    - host: uatreginsights.internal.teamleaseregtech.com

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: trpl-regtrack-insights-api
                port:
                  number: 80
